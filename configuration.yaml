# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include_dir_list automations/
script: !include scripts.yaml
scene: !include scenes.yaml

logger:
  default: info
  logs:
    homeassistant.components.http: debug

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.69.0.0/16
    - 172.16.0.0/12
    - 172.32.0.0/11
    - 127.0.0.1
    - 10.69.30.1
    - 172.31.0.1
    - 172.18.0.1
    - 10.69.1.100

shell_command:
  gitops_pull: 'cd /config && git config core.sshCommand "ssh -F /config/.ssh/config" && git fetch origin main && git reset --hard origin/main'
  
# Frontend UI Registry Linkage for Code-Driven Dashboards
lovelace:
  dashboards:
    vault-cockpit:
      mode: yaml
      title: Vault Cockpit
      icon: mdi:server-network
      show_in_sidebar: true
      filename: dashboards/vault_cockpit.yaml
    house-command:
      mode: yaml
      title: House Command
      icon: mdi:home-assistant
      show_in_sidebar: true
      filename: dashboards/house_command.yaml
